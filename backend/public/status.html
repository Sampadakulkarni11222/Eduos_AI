<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School ERP — Server Status</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1rem;
      padding: 2.5rem 3rem;
      width: 100%;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }

    .logo {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    /* Status indicator */
    .status-ring {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .status-ring::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
      animation: spin 1.2s linear infinite;
    }

    .status-ring.checking::before  { border-top-color: #64748b; }
    .status-ring.online::before    { border-top-color: #22c55e; animation: none; border-color: #22c55e33; }
    .status-ring.offline::before   { border-top-color: #ef4444; animation: none; border-color: #ef444433; }

    .status-dot {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      transition: background 0.3s;
    }

    .checking  .status-dot { background: #1e293b; }
    .online    .status-dot { background: #14532d; }
    .offline   .status-dot { background: #450a0a; }

    .status-label {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      transition: color 0.3s;
    }

    .checking  .status-label { color: #64748b; }
    .online    .status-label { color: #22c55e; }
    .offline   .status-label { color: #ef4444; }

    .status-sub {
      font-size: 0.85rem;
      color: #475569;
      margin-bottom: 2rem;
    }

    /* Metrics */
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .metric {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 0.6rem;
      padding: 0.75rem;
    }

    .metric-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #475569;
      margin-bottom: 0.25rem;
    }

    .metric-value {
      font-size: 0.95rem;
      font-weight: 600;
      color: #cbd5e1;
      font-variant-numeric: tabular-nums;
    }

    /* Links */
    .links {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1.1rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      transition: opacity 0.15s;
      cursor: pointer;
      border: none;
    }
    .btn:hover { opacity: 0.8; }

    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-ghost   { background: #1e293b; border: 1px solid #334155; color: #94a3b8; }

    /* Footer */
    .footer {
      font-size: 0.75rem;
      color: #334155;
    }

    .footer span { color: #475569; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🏫</div>
    <h1>School ERP</h1>

    <div class="status-ring checking" id="ring">
      <div class="status-dot">
        <span id="status-icon" class="pulse">⏳</span>
      </div>
    </div>

    <div class="status-label" id="status-label">Checking…</div>
    <div class="status-sub" id="status-sub">Pinging /api/v1/health</div>

    <div class="metrics">
      <div class="metric">
        <div class="metric-label">Response Time</div>
        <div class="metric-value" id="latency">— ms</div>
      </div>
      <div class="metric">
        <div class="metric-label">Last Checked</div>
        <div class="metric-value" id="last-checked">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">Environment</div>
        <div class="metric-value" id="env">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">Timestamp</div>
        <div class="metric-value" id="server-time">—</div>
      </div>
    </div>

    <div class="links">
      <a href="/api-docs" class="btn btn-primary" target="_blank">📄 API Docs</a>
      <button class="btn btn-ghost" onclick="check()">🔄 Refresh</button>
    </div>

    <div class="footer">
      Auto-refreshes every <span>30 s</span>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    async function check() {
      const ring = $('ring');
      ring.className = 'status-ring checking';
      $('status-icon').textContent = '⏳';
      $('status-icon').classList.add('pulse');
      $('status-label').textContent = 'Checking…';

      const t0 = performance.now();
      try {
        const res = await fetch('/api/v1/health');
        const ms = Math.round(performance.now() - t0);
        const body = await res.json();

        ring.className = 'status-ring online';
        $('status-icon').textContent = '✅';
        $('status-icon').classList.remove('pulse');
        $('status-label').textContent = 'Online';
        $('status-sub').textContent = body.message ?? 'Server is healthy';
        $('latency').textContent = ms + ' ms';
        $('env').textContent = body.data?.env ?? '—';

        const ts = body.data?.timestamp ? new Date(body.data.timestamp) : new Date();
        $('server-time').textContent = ts.toLocaleTimeString();
      } catch {
        const ms = Math.round(performance.now() - t0);
        ring.className = 'status-ring offline';
        $('status-icon').textContent = '❌';
        $('status-icon').classList.remove('pulse');
        $('status-label').textContent = 'Offline';
        $('status-sub').textContent = 'Could not reach the server';
        $('latency').textContent = ms + ' ms';
        $('env').textContent = '—';
        $('server-time').textContent = '—';
      }

      $('last-checked').textContent = new Date().toLocaleTimeString();
    }

    check();
    setInterval(check, 30_000);
  </script>
</body>
</html>

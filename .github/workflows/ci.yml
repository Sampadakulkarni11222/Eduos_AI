name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Pinned so the cache key, the download and the test run always name the
      # same binary. Unpinned, the version is whatever mongodb-memory-server
      # currently defaults to, which moves with its own releases — and when a
      # runner image cannot supply that build, all 29 test files die in their
      # beforeAll at once, which reads as a broken suite rather than a missing
      # MongoDB. This is the version the installed library defaults to today.
      MONGOMS_VERSION: '8.2.6'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: mongodb-memory-server needs >=20.19 and the Vite that
          # Vitest 4 pulls in needs ^20.19 || >=22.12, so a runner image whose
          # newest 20.x is older than 20.19 fails before the first test runs —
          # and does it in seconds, which looks like nothing at all in the log.
          # The app itself only requires >=18, so nothing here is a constraint.
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # One line, in the log, saying what this run actually is. Worth the two
      # seconds: an install-time failure otherwise gives no way to tell a
      # toolchain mismatch from a broken lockfile.
      - name: Toolchain
        run: node -v && npm -v && npm ls esbuild --depth=0

      # mongodb-memory-server downloads a MongoDB binary on first use; caching
      # it keeps the test job from re-fetching ~100MB on every run.
      #
      # MONGOMS_DOWNLOAD_DIR is not optional here. Left unset, the library
      # resolves its own path — `backend/node_modules/.cache/mongodb-memory-server`
      # once node_modules exists — and never looks at ~/.cache/mongodb-binaries,
      # so the cache below stored an empty directory and every run re-downloaded
      # the binary inside the suite's 120s hookTimeout. Set it explicitly, to
      # the same path the cache uses, and the two are actually talking about the
      # same directory. $HOME is expanded here because a job-level `env:` block
      # would pass the tilde through literally.
      - name: Point mongodb-memory-server at the cached directory
        run: echo "MONGOMS_DOWNLOAD_DIR=$HOME/.cache/mongodb-binaries" >> "$GITHUB_ENV"

      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          # The version is in the key so bumping mongodb-memory-server (which
          # changes the MongoDB build it wants) fetches a fresh binary instead
          # of restoring a cache that can never satisfy it.
          key: mongodb-binaries-${{ runner.os }}-${{ env.MONGOMS_VERSION }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-${{ env.MONGOMS_VERSION }}-
            mongodb-binaries-${{ runner.os }}-

      # Fetching the binary here rather than inside the suite. It is the one
      # step that reaches the network at test time, and when it fails it fails
      # 29 times over — once per file's beforeAll, each reported as a test
      # error. Doing it once, first, means a download or a distro that the
      # runner image cannot satisfy is reported as exactly that.
      - name: Warm the MongoDB binary
        run: |
          node --input-type=module -e "
            import { MongoMemoryServer } from 'mongodb-memory-server';
            const server = await MongoMemoryServer.create();
            console.log('mongod ready at', server.getUri());
            await server.stop();
          "

      # eslint:recommended over src/ and scripts/. Errors fail the build; the 20
      # existing warnings are unused imports/variables, capped here so the count
      # can only go down — lower the cap as they are cleaned up.
      - run: npm run lint -- --max-warnings 20

      - run: npm test

      - run: npm run build

      # The bundle is what `npm start` actually runs, so a bundle that does not
      # parse is a broken deploy even when the source is fine.
      - name: Verify the built bundle parses
        run: node --check dist/app.js

  frontend:
    name: Frontend — typecheck, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      # The lint baseline is zero errors and zero warnings; anything new fails
      # the build rather than accumulating.
      - run: npx next lint --dir src --max-warnings 0

      - run: npm test

      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Advisory: a new CVE in a transitive dependency should be visible without
    # blocking an unrelated pull request.
    continue-on-error: true
    strategy:
      matrix:
        package: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # `npm audit --audit-level=high`, except advisories reviewed and listed in
      # .github/audit-allowlist.json (each with its reason and a review date).
      # Any other high/critical advisory still fails this job.
      - run: node ../.github/scripts/audit-check.mjs
        working-directory: ${{ matrix.package }}

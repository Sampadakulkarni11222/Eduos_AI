name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # mongodb-memory-server downloads a MongoDB binary on first use; caching
      # it keeps the test job from re-fetching ~100MB on every run.
      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - run: npm test

      - run: npm run build

      # The bundle is what `npm start` actually runs, so a bundle that does not
      # parse is a broken deploy even when the source is fine.
      - name: Verify the built bundle parses
        run: node --check dist/app.js

  frontend:
    name: Frontend — typecheck, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      # The lint baseline is zero errors and zero warnings; anything new fails
      # the build rather than accumulating.
      - run: npx next lint --dir src --max-warnings 0

      - run: npm test

      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Advisory: a new CVE in a transitive dependency should be visible without
    # blocking an unrelated pull request.
    continue-on-error: true
    strategy:
      matrix:
        package: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm audit --audit-level=high
        working-directory: ${{ matrix.package }}

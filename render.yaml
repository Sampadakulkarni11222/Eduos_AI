services:
  - type: web
    name: school-erp-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    # NOTE — uploaded files (documents/course material/ID cards live under
    # backend/uploads) do NOT persist across deploys/restarts on Render's
    # free plan: it has no writable disk that survives a redeploy. To fix
    # this properly, either (a) upgrade this service to a paid plan and add
    # a `disk:` block here mounted at `backend/uploads`, e.g.:
    #   disk:
    #     name: uploads
    #     mountPath: /opt/render/project/src/backend/uploads
    #     sizeGB: 1
    # or (b) move file storage to S3-compatible object storage. Left
    # undeclared here (rather than added and silently failing to deploy on
    # the free plan) — pick one and apply it before relying on uploads in
    # production.
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Secrets are NEVER committed here. `sync: false` means the value is
      # entered once in the Render dashboard (Environment tab) and stays there.
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MEDICAL_ENCRYPTION_KEY
        sync: false
      - key: SWAGGER_ENABLED
        value: "false"
      # ── One-time sign-in codes (OTP) ─────────────────────────────
      # Production never returns a code in an API response; codes are only
      # delivered by a real provider. Without one, the service still starts,
      # OTP sign-in answers 503, and password / Google sign-in keep working.
      # To enable OTP, pick a provider here and enter its secrets in the
      # Render dashboard (Environment tab) — never in this file.
      #   Email: EMAIL_PROVIDER=resend + RESEND_API_KEY + EMAIL_FROM
      #   SMS:   SMS_PROVIDER=twilio   + TWILIO_ACCOUNT_SID + TWILIO_AUTH_TOKEN + TWILIO_FROM_NUMBER
      # A provider named here but missing its secrets stops the service from
      # starting, so a half-finished setup is caught at deploy time.
      - key: EMAIL_PROVIDER
        sync: false
      - key: SMS_PROVIDER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # Real Google sign-in (verified server-side against this client id).
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Same random value on both services (e.g. `openssl rand -hex 32`). Lets
      # the frontend's session-refresh proxy — which limits failed refreshes
      # per real client — skip this service's per-address failure limit.
      # Optional; without it the proxy is simply one more address.
      - key: FRONTEND_PROXY_SECRET
        sync: false

  - type: web
    name: school-erp-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Real Google sign-in. The demo Google popup and the on-screen OTP hint
      # exist only in development builds; no flag enables them here.
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      # Must equal the backend's FRONTEND_PROXY_SECRET. Server-side only —
      # never prefix it NEXT_PUBLIC_.
      - key: FRONTEND_PROXY_SECRET
        sync: false
      - key: NEXT_PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: school-erp-backend
          envVarKey: RENDER_EXTERNAL_URL

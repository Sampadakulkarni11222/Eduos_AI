services:
  - type: web
    name: school-erp-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    # NOTE — uploaded files (documents/course material/ID cards live under
    # backend/uploads) do NOT persist across deploys/restarts on Render's
    # free plan: it has no writable disk that survives a redeploy. To fix
    # this properly, either (a) upgrade this service to a paid plan and add
    # a `disk:` block here mounted at `backend/uploads`, e.g.:
    #   disk:
    #     name: uploads
    #     mountPath: /opt/render/project/src/backend/uploads
    #     sizeGB: 1
    # or (b) move file storage to S3-compatible object storage. Left
    # undeclared here (rather than added and silently failing to deploy on
    # the free plan) — pick one and apply it before relying on uploads in
    # production.
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Secrets are NEVER committed here. `sync: false` means the value is
      # entered once in the Render dashboard (Environment tab) and stays there.
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MEDICAL_ENCRYPTION_KEY
        sync: false
      - key: SWAGGER_ENABLED
        value: "false"
      # ── TESTING PHASE ONLY ───────────────────────────────────────
      # The project has no SMS/email provider yet, so the 6-digit code is
      # echoed back to the client (`devOtp`) and shown on the sign-in screen
      # for every login path. This also lets the service boot with the
      # console providers instead of refusing to start.
      # ⚠ REMOVE THIS (and set SMS_PROVIDER/EMAIL_PROVIDER to real vendors)
      # before real users sign in — while it is on, anyone who knows an email
      # or phone number can read that account's code out of the response.
      - key: ALLOW_DEV_OTP_IN_PRODUCTION
        value: "true"

  - type: web
    name: school-erp-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # ── TESTING PHASE ONLY — pair of ALLOW_DEV_OTP_IN_PRODUCTION above ──
      # Keeps the demo "Continue with Google" popup available in this build.
      # The OTP hint on the sign-in screen needs no flag here: it renders
      # whenever the backend echoes a code. Remove both before launch.
      - key: NEXT_PUBLIC_ALLOW_DEV_OTP
        value: "true"
      - key: NEXT_PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: school-erp-backend
          envVarKey: RENDER_EXTERNAL_URL

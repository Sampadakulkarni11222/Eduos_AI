services:
  - type: web
    name: school-erp-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    # NOTE - uploaded files do NOT persist across deploys/restarts on Render's
    # free plan. Upgrade to a paid plan and add a disk block, or use S3.
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Secrets are NEVER committed here. sync: false means the value is
      # entered once in the Render dashboard (Environment tab) and stays there.
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MEDICAL_ENCRYPTION_KEY
        sync: false
      - key: SWAGGER_ENABLED
        value: 'false'

      # CORS - must be your deployed frontend origin (no trailing slash).
      # Example: https://school-erp-frontend.onrender.com
      - key: CORS_ORIGIN
        sync: false

      # OTP delivery - production never echoes codes in responses.
      # Without a real provider OTP sign-in answers 503; password/Google work.
      #   Email: EMAIL_PROVIDER=resend  + RESEND_API_KEY + EMAIL_FROM
      #   SMS:   SMS_PROVIDER=twilio   + TWILIO_ACCOUNT_SID + TWILIO_AUTH_TOKEN + TWILIO_FROM_NUMBER
      - key: EMAIL_PROVIDER
        sync: false
      - key: SMS_PROVIDER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

      # Payments
      # 'none'     - online payment disabled (safe default for a fresh deploy)
      # 'razorpay' - override in dashboard; also add the three Razorpay keys
      # 'sandbox'  - NEVER in production; the gate refuses to start on it
      - key: PAYMENT_PROVIDER
        value: none
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # WhatsApp
      # WHATSAPP_VERIFY_TOKEN is always checked in production - the gate refuses
      # to start if it is still the placeholder 'change-this-verify-token'.
      # Generate with: openssl rand -hex 24
      # Set the same value in the Meta app dashboard (webhook verify token field).
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      # The three below are needed only for live WhatsApp messages.
      # Leaving them unset keeps the bot in simulation (log-only) mode.
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_ACCESS_TOKEN
        sync: false
      # App Secret from the Meta dashboard - authenticates inbound webhooks.
      # Required once WA_PHONE_NUMBER_ID and WA_ACCESS_TOKEN are set.
      - key: WA_APP_SECRET
        sync: false
      # WhatsApp via Chatflow-Pro. Webhook URL to register in Chatflow-Pro:
      # https://<this-service>/api/v1/whatsapp/chatflow/webhook?token=<CHATFLOW_WEBHOOK_TOKEN>
      - key: CHATFLOW_API_URL
        sync: false
      - key: CHATFLOW_API_KEY
        sync: false
      - key: CHATFLOW_WA_NUMBER_ID
        sync: false
      # Required once CHATFLOW_API_URL/KEY are set. Generate: openssl rand -hex 24
      - key: CHATFLOW_WEBHOOK_TOKEN
        sync: false
      - key: CHATFLOW_WEBHOOK_SECRET
        sync: false

      # AI provider
      # 'rules'      - no API key needed; deterministic answers (safe default)
      # 'gemini'     - set GEMINI_API_KEY in the dashboard
      # 'anthropic'  - set ANTHROPIC_API_KEY in the dashboard
      # 'openrouter' - set OPENROUTER_API_KEY in the dashboard
      - key: AI_PROVIDER
        value: rules
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # Google Sign-In
      - key: GOOGLE_CLIENT_ID
        sync: false

      # Session refresh proxy - same value on both services (openssl rand -hex 32)
      - key: FRONTEND_PROXY_SECRET
        sync: false

  - type: web
    name: school-erp-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      # Must equal the backend FRONTEND_PROXY_SECRET. Server-side only.
      - key: FRONTEND_PROXY_SECRET
        sync: false
      - key: NEXT_PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: school-erp-backend
          envVarKey: RENDER_EXTERNAL_URL
